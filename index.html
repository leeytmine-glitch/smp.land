<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMP LAND | Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-box">
    <h1>SMP <span>LAND</span></h1>
    <p class="subtitle">به دنیای ماینکرفت خوش آمدی!</p>
    <h2>LOGIN</h2>

    <form id="loginForm">
      <input type="text" id="username" placeholder="نام کاربری" autocomplete="username" required>
      <input type="password" id="password" placeholder="رمز عبور" autocomplete="current-password" required>
      <p id="message" aria-live="polite"></p>
      <button type="submit">LOGIN 🎮</button>
    </form>

    <p class="footer-text">ENTER THE WORLD OF SMP LAND</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
